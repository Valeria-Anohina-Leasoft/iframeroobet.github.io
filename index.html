<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Roobet Iframe Slot Simulator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #08091f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      padding-bottom: 40px;
    }

    .tool-panel {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #1a1638;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #312a63;
    }

    .url-row {
      display: flex;
      gap: 10px;
    }

    .url-row input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #7a64d8;
      background: #0e1028;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .url-row button {
      padding: 0 24px;
      border: none;
      border-radius: 10px;
      background: #ffb700;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls button,
    .controls select {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2b2558;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    .controls button.active {
      background: #ffb700;
      color: #ffffff;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* DESKTOP ROOBET */

    .desktop-roobet {
      min-height: 100vh;
      background: #080b1d;
    }

    .desktop-header {
      height: 70px;
      background: #171534;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .desktop-logo {
      color: #ffbd18;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .desktop-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .desktop-actions button {
      height: 38px;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      background: #29234f;
      color: white;
      font-weight: bold;
    }

    .desktop-actions .register {
      background: #ffb700;
    }

    .desktop-layout {
      display: flex;
    }

    .desktop-sidebar {
      width: 215px;
      background: #171534;
      padding: 12px;
      min-height: calc(100vh - 70px);
    }

    .side-item {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 9px;
      background: #312b5d;
      font-size: 14px;
      font-weight: bold;
    }

    .desktop-game-area {
      flex: 1;
      padding: 10px 56px 40px;
    }

    .desktop-frame {
      width: 100%;
      height: calc(100vh - 120px);
      min-height: 620px;
      border-radius: 12px;
      overflow: hidden;
      background: #050714;
    }

    /* MOBILE ROOBET */

    .mobile-stage {
      width: 100%;
      overflow-x: auto;
      padding: 24px 0 60px;
    }

    .phone {
      margin: 0 auto;
      background: #171534;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2b2558;
    }

    .phone.portrait {
      width: var(--device-width);
      min-height: var(--device-height);
    }

    .phone.landscape {
      width: var(--device-height);
      min-height: var(--device-width);
    }

    .mobile-header {
      height: 72px;
      background: #171534;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .mobile-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #ffbd18;
    }

    .mobile-actions {
      display: flex;
      gap: 10px;
    }

    .mobile-actions button {
      height: 44px;
      border: none;
      border-radius: 16px;
      padding: 0 20px;
      background: #2c2558;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .mobile-actions .register {
      background: #ffb700;
    }

    .mobile-game-wrap {
      background: #080b1d;
      padding: 0 16px;
    }

    .mobile-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 10px;
      overflow: hidden;
      background: #050714;
    }

    .mobile-landscape-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #050714;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .mobile-nav {
      height: 60px;
      background: #171534;
      display: flex;
      align-items: center;
      justify-content: space-around;
      font-size: 12px;
      font-weight: bold;
    }

    .mobile-nav div {
      text-align: center;
    }

    .info {
      padding: 14px 18px;
      font-size: 13px;
      color: #bdb6f1;
      text-align: center;
    }

    @media (max-width: 768px) {
      .url-row {
        flex-direction: column;
      }

      .url-row button {
        height: 48px;
      }

      .desktop-sidebar {
        display: none;
      }

      .desktop-game-area {
        padding: 10px 16px 40px;
      }

      .desktop-frame {
        height: 70vh;
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <section class="tool-panel">
    <div class="url-row">
      <input
        id="gameUrl"
        type="text"
        placeholder="Paste game launch URL here..."
      />
      <button onclick="loadGame()">Load Game</button>
    </div>

    <div class="controls">
      <button id="desktopBtn" class="active" onclick="switchView('desktop')">Desktop</button>
      <button id="mobileBtn" onclick="switchView('mobile')">Mobile Portrait</button>
      <button id="landscapeBtn" onclick="switchView('landscape')">Mobile Landscape</button>

      <select id="deviceSelect" onchange="changeDevice()">
        <option value="375x667">iPhone SE / 375×667</option>
        <option value="390x844" selected>iPhone 12/13/14 / 390×844</option>
        <option value="393x852">iPhone 15 / 393×852</option>
        <option value="430x932">iPhone Pro Max / 430×932</option>
        <option value="360x740">Android Small / 360×740</option>
        <option value="412x915">Pixel / Galaxy / 412×915</option>
        <option value="768x1024">iPad / 768×1024</option>
      </select>
    </div>
  </section>

  <!-- DESKTOP VIEW -->
  <section id="desktopView" class="view active">
    <div class="desktop-roobet">
      <header class="desktop-header">
        <div class="desktop-logo">ROOBET</div>
        <div class="desktop-actions">
          <button>⌕</button>
          <button>Login</button>
          <button class="register">Register</button>
          <button>☰</button>
        </div>
      </header>

      <main class="desktop-layout">
        <aside class="desktop-sidebar">
          <div class="side-item">🎰 Casino</div>
          <div class="side-item">Roobet Games</div>
          <div class="side-item">Popular</div>
          <div class="side-item">New Games</div>
          <div class="side-item">Slots</div>
          <div class="side-item">Bonus Buys</div>
          <div class="side-item">Live Casino</div>
          <div class="side-item">Sportsbook</div>
          <div class="side-item">Promotions</div>
        </aside>

        <section class="desktop-game-area">
          <div class="desktop-frame">
            <iframe
              id="desktopFrame"
              allowfullscreen
              allow="fullscreen; autoplay; clipboard-read; clipboard-write"
            ></iframe>
          </div>
        </section>
      </main>
    </div>
  </section>

  <!-- MOBILE PORTRAIT VIEW -->
  <section id="mobileView" class="view">
    <div class="mobile-stage">
      <div id="phonePortrait" class="phone portrait">
        <header class="mobile-header">
          <div class="mobile-logo"></div>
          <div class="mobile-actions">
            <button>Login</button>
            <button class="register">Register</button>
          </div>
        </header>

        <main class="mobile-game-wrap">
          <div class="mobile-frame">
            <iframe
              id="mobileFrame"
              allowfullscreen
              allow="fullscreen; autoplay; clipboard-read; clipboard-write"
            ></iframe>
          </div>
        </main>

        <nav class="mobile-nav">
          <div>☰<br />MENU</div>
          <div>⌕<br />SEARCH</div>
          <div>🎰<br />CASINO</div>
          <div>⚽<br />SPORTS</div>
          <div>💬<br />CHAT</div>
        </nav>

        <div class="info">Scroll page to check bottom part of the game.</div>
      </div>
    </div>
  </section>

  <!-- MOBILE LANDSCAPE VIEW -->
  <section id="landscapeView" class="view">
    <div class="mobile-stage">
      <div id="phoneLandscape" class="phone landscape">
        <header class="mobile-header">
          <div class="mobile-logo"></div>
          <div class="mobile-actions">
            <button>Login</button>
            <button class="register">Register</button>
          </div>
        </header>

        <main class="mobile-game-wrap">
          <div class="mobile-landscape-frame">
            <iframe
              id="landscapeFrame"
              allowfullscreen
              allow="fullscreen; autoplay; clipboard-read; clipboard-write"
            ></iframe>
          </div>
        </main>

        <nav class="mobile-nav">
          <div>☰<br />MENU</div>
          <div>⌕<br />SEARCH</div>
          <div>🎰<br />CASINO</div>
          <div>⚽<br />SPORTS</div>
          <div>💬<br />CHAT</div>
        </nav>

        <div class="info">Landscape mode simulation.</div>
      </div>
    </div>
  </section>

  <script>
    const desktopFrame = document.getElementById("desktopFrame");
    const mobileFrame = document.getElementById("mobileFrame");
    const landscapeFrame = document.getElementById("landscapeFrame");

    const desktopView = document.getElementById("desktopView");
    const mobileView = document.getElementById("mobileView");
    const landscapeView = document.getElementById("landscapeView");

    const desktopBtn = document.getElementById("desktopBtn");
    const mobileBtn = document.getElementById("mobileBtn");
    const landscapeBtn = document.getElementById("landscapeBtn");

    const phonePortrait = document.getElementById("phonePortrait");
    const phoneLandscape = document.getElementById("phoneLandscape");

    function loadGame() {
      const url = document.getElementById("gameUrl").value.trim();

      if (!url) {
        alert("Please paste game launch URL first");
        return;
      }

      desktopFrame.src = url;
      mobileFrame.src = url;
      landscapeFrame.src = url;
    }

    function switchView(view) {
      desktopView.classList.remove("active");
      mobileView.classList.remove("active");
      landscapeView.classList.remove("active");

      desktopBtn.classList.remove("active");
      mobileBtn.classList.remove("active");
      landscapeBtn.classList.remove("active");

      if (view === "desktop") {
        desktopView.classList.add("active");
        desktopBtn.classList.add("active");
      }

      if (view === "mobile") {
        mobileView.classList.add("active");
        mobileBtn.classList.add("active");
      }

      if (view === "landscape") {
        landscapeView.classList.add("active");
        landscapeBtn.classList.add("active");
      }

      window.scrollTo(0, 0);
    }

    function changeDevice() {
      const value = document.getElementById("deviceSelect").value;
      const [width, height] = value.split("x");

      phonePortrait.style.setProperty("--device-width", width + "px");
      phonePortrait.style.setProperty("--device-height", height + "px");

      phoneLandscape.style.setProperty("--device-width", width + "px");
      phoneLandscape.style.setProperty("--device-height", height + "px");
    }

    changeDevice();
  </script>
</body>
</html>
